<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock — Ajustes e Sugestão (Mexe-Mexe)</title>
<style>
  :root { --tinta:#3b2f2a; --creme:#fbf6ee; --ambar:#e7a400; --ambar-claro:#f3c969; --ambar-fundo:#fff3d6; --vermelho:#c8102e;
          --titulo:'Fredoka','Nunito',system-ui,sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e9e1d4; font-family:'Nunito',system-ui,sans-serif; color:var(--tinta); }
  .controles { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:10px; background:#3b2f2a; }
  .controles button { font:700 15px 'Nunito',system-ui; padding:8px 12px; border-radius:10px; border:0; background:#efe5d6; color:var(--tinta); }
  .controles button.on { background:var(--ambar-claro); }
  .explica { max-width:760px; margin:12px auto 0; padding:0 14px; font-size:17px; line-height:1.4; }
  .palco { display:flex; gap:26px; justify-content:center; flex-wrap:wrap; padding:18px; }
  .aparelho { width:390px; height:844px; border-radius:38px; border:10px solid #1d1a19; background:#d9cfc0 linear-gradient(#0003,#0003); position:relative; overflow:hidden; }
  .aparelho.ipad { width:820px; height:640px; border-radius:26px; }
  .legenda { text-align:center; font-weight:800; margin-bottom:6px; }
  .fundo { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:14px; background:#3b2f2a66; }
  .janela { background:var(--creme); border-radius:24px; padding:18px 20px 14px; width:min(560px,100%); max-height:100%; display:flex; flex-direction:column; text-align:center; box-shadow:0 10px 40px #0005; }
  h2 { font-family:var(--titulo); font-weight:700; font-size:26px; margin:0 0 4px; }
  .corpo { flex:1; min-height:0; overflow:auto; }
  .secao { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:#8a7a70; text-align:left; margin:14px 2px 2px; }
  .ajuste { display:flex; align-items:center; gap:12px; margin:10px 0; text-align:left; }
  .nome-ajuste { flex:1.1; font-size:19px; font-weight:800; }
  .nome-ajuste small { display:block; font-size:13px; font-weight:700; color:#8a7a70; }
  .opcoes { flex:2; display:flex; gap:6px; }
  .opcoes button { flex:1; min-height:50px; border:0; border-radius:12px; padding:6px 4px; background:#fff; color:var(--tinta); box-shadow:inset 0 0 0 2px #e2d8c8; font:800 17px/1.1 'Nunito',system-ui; }
  .opcoes button.atual { background:var(--ambar-fundo); box-shadow:inset 0 0 0 3px var(--ambar); }
  .amostra { display:block; font-size:15px; margin-top:2px; letter-spacing:1px; } .v{color:#c8102e} .az{color:#1660c9} .vd{color:#19813f}
  .grande { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:10px; min-height:58px; border:0; border-radius:16px; padding:10px 16px; background:var(--tinta); color:#fff; font:700 22px/1.15 var(--titulo); }
  .grande.secundario { background:#efe5d6; color:var(--tinta); }
  .grande:disabled { opacity:.5; }
  .rodape { display:flex; gap:10px; padding-top:10px; border-top:2px solid #e4d9c8; margin-top:6px; }
  .rodape .grande { flex:1; margin-top:0; }
  .linha-botoes { display:flex; gap:10px; } .linha-botoes .grande { flex:1; }
  .link { background:none; border:0; color:#6b5a50; text-decoration:underline; font-size:14px; margin:8px auto 0; padding:6px; display:block; }
  /* Sugestão */
  .texto { font-size:18px; margin:4px 0 10px; line-height:1.3; }
  textarea { width:100%; min-height:150px; flex:1; resize:none; padding:12px; border-radius:16px; border:3px solid var(--ambar-claro); background:#fff; color:var(--tinta); font:700 19px 'Nunito',system-ui; }
  .contador { text-align:right; font-size:14px; opacity:.7; }
  .vai-junto { display:flex; gap:10px; align-items:flex-start; text-align:left; background:#fff; border-radius:14px; padding:10px 12px; margin-top:8px; box-shadow:inset 0 0 0 2px #e2d8c8; font-size:16px; line-height:1.3; }
  .vai-junto b { font-size:17px; }
  .aviso-erro { margin:8px 0 0; padding:10px 12px; border-radius:14px; background:#fff3cd; font-size:17px; text-align:left; }
  .coracao { font-size:64px; margin-top:20px; }
  .novo { outline:3px dashed #e7a400; outline-offset:4px; border-radius:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="controles">
  <button data-v="hoje">👀 Ajustes como é hoje</button>
  <button data-v="novo" class="on">✨ Ajustes novo</button>
  <button data-v="sug">💬 Dar sugestão</button>
  <button data-v="semconta">💬 Sugestão sem conta</button>
  <button data-v="erro">📵 Sem internet</button>
  <button data-v="obrigado">🧡 Obrigado</button>
</div>
<p class="explica" id="explica"></p>
<div class="palco">
  <div><div class="legenda">iPhone em pé</div><div class="aparelho" id="tel"></div></div>
  <div><div class="legenda">iPad deitado</div><div class="aparelho ipad" id="ipad"></div></div>
</div>

<template id="hoje">
  <div class="fundo"><div class="janela">
    <h2>⚙️ Ajustes</h2>
    <div class="corpo">
      <div class="secao">Tela</div>
      <div class="ajuste"><div class="nome-ajuste">Visual</div><div class="opcoes"><button class="atual">Melhor idade</button><button>Normal</button></div></div>
      <div class="ajuste"><div class="nome-ajuste">Cores dos naipes</div><div class="opcoes"><button class="atual">2 cores<span class="amostra"><b class="v">♥♦</b><b>♠♣</b></span></button><button>4 cores<span class="amostra"><b class="v">♥</b><b class="az">♦</b><b>♠</b><b class="vd">♣</b></span></button></div></div>
      <div class="secao">Computador</div>
      <div class="ajuste"><div class="nome-ajuste">Velocidade</div><div class="opcoes"><button class="atual">Devagar</button><button>Normal</button></div></div>
      <div class="ajuste"><div class="nome-ajuste">Ver animações<small>dica e adversário</small></div><div class="opcoes"><button class="atual">Sim</button><button>Não</button></div></div>
      <div class="secao">Mais</div>
      <div class="linha-botoes"><button class="grande secundario">📊 Retrospecto</button><button class="grande secundario">☁️ Conta</button></div>
      <button class="link">📋 Baixar o diário do jogo (para o Claude investigar um problema)</button>
    </div>
    <div class="rodape"><button class="grande">Pronto</button></div>
  </div></div>
</template>

<template id="novo">
  <div class="fundo"><div class="janela">
    <h2>⚙️ Ajustes</h2>
    <div class="corpo">
      <div class="secao">Tela</div>
      <div class="ajuste"><div class="nome-ajuste">Visual</div><div class="opcoes"><button class="atual">Melhor idade</button><button>Normal</button></div></div>
      <div class="ajuste"><div class="nome-ajuste">Cores dos naipes</div><div class="opcoes"><button class="atual">2 cores<span class="amostra"><b class="v">♥♦</b><b>♠♣</b></span></button><button>4 cores<span class="amostra"><b class="v">♥</b><b class="az">♦</b><b>♠</b><b class="vd">♣</b></span></button></div></div>
      <div class="secao">Computador</div>
      <div class="ajuste"><div class="nome-ajuste">Velocidade</div><div class="opcoes"><button class="atual">Devagar</button><button>Normal</button></div></div>
      <div class="ajuste"><div class="nome-ajuste">Ver animações<small>dica e adversário</small></div><div class="opcoes"><button class="atual">Sim</button><button>Não</button></div></div>
      <div class="secao">Mais</div>
      <div class="novo">
        <div class="ajuste"><div class="nome-ajuste">Retrospecto<small>vitórias e derrotas</small></div><div class="opcoes"><button>📊 Ver</button></div></div>
        <div class="ajuste"><div class="nome-ajuste">Conta<small>victor@…</small></div><div class="opcoes"><button>☁️ Abrir</button></div></div>
        <div class="ajuste"><div class="nome-ajuste">Sugestão<small>ideia, problema ou elogio</small></div><div class="opcoes"><button>💬 Escrever</button></div></div>
        <div class="ajuste"><div class="nome-ajuste">Diário<small>das últimas partidas</small></div><div class="opcoes"><button>📋 Baixar</button></div></div>
      </div>
    </div>
    <div class="rodape"><button class="grande">Pronto</button></div>
  </div></div>
</template>

<template id="sug">
  <div class="fundo"><div class="janela" style="height:100%">
    <h2>💬 O que podemos melhorar?</h2>
    <p class="texto">Escreva do seu jeito. Pode ser uma ideia, um problema ou um elogio.</p>
    <textarea placeholder="Toque aqui e escreva…">A dica não achou jogada, mas eu achei: o 7 de copas cabia no jogo de 7.</textarea>
    <div class="contador">71/1000</div>
    <div class="vai-junto"><span>📋</span><span><b>Vai junto o diário das últimas partidas.</b><br>Assim dá para ver as cartas e achar o problema.</span></div>
    <p class="texto" style="font-size:14px;color:#6b5a50;margin-top:8px">Só a equipe do jogo lê. Vai junto o seu e-mail, para podermos responder.</p>
    <div class="rodape"><button class="grande secundario">Voltar</button><button class="grande">Enviar</button></div>
  </div></div>
</template>

<template id="semconta">
  <div class="fundo"><div class="janela">
    <h2>💬 Dar sugestão</h2>
    <p class="texto">Para mandar uma sugestão, entre na sua conta (é de graça).<br>Assim podemos responder no seu e-mail.</p>
    <div class="rodape"><button class="grande secundario">Voltar</button><button class="grande">☁️ Entrar</button></div>
  </div></div>
</template>

<template id="erro">
  <div class="fundo"><div class="janela" style="height:100%">
    <h2>💬 O que podemos melhorar?</h2>
    <p class="texto">Escreva do seu jeito. Pode ser uma ideia, um problema ou um elogio.</p>
    <textarea>A dica não achou jogada, mas eu achei: o 7 de copas cabia no jogo de 7.</textarea>
    <div class="contador">71/1000</div>
    <p class="aviso-erro">Sem internet agora. Tente de novo quando a internet voltar. Seu texto continua aqui.</p>
    <div class="rodape"><button class="grande secundario">Voltar</button><button class="grande">Tentar de novo</button></div>
  </div></div>
</template>

<template id="obrigado">
  <div class="fundo"><div class="janela">
    <div class="coracao">🧡</div>
    <h2>Obrigado!</h2>
    <p class="texto">Recebemos a sua sugestão. Ela nos ajuda a deixar o jogo melhor.</p>
    <div class="rodape"><button class="grande">Voltar ao jogo</button></div>
  </div></div>
</template>

<script>
  const textos = {
    hoje: 'Como está hoje: "Tela" e "Computador" são linhas com botões brancos; "Mais" tem dois botões bege grandes e um link sublinhado.',
    novo: 'Proposta: "Mais" fica no MESMO jeito das outras linhas (nome à esquerda, botão branco à direita). Entram "Sugestão" (nova) e o diário com nome novo. O tracejado amarelo é só para mostrar o que mudou.',
    sug: 'Tocar em "Escrever" abre esta janela. O diário vai junto sempre (sem pergunta a mais). Só manda quem tem conta.',
    semconta: 'Quem não entrou na conta vê isto em vez da caixa de texto. "Entrar" abre a tela da conta.',
    erro: 'Sem internet: o texto não se perde. É só tocar de novo quando a internet voltar.',
    obrigado: 'Depois de enviar.',
  };
  function mostrar(v) {
    for (const id of ['tel', 'ipad']) document.getElementById(id).innerHTML = document.getElementById(v).innerHTML;
    document.getElementById('explica').textContent = textos[v];
    document.querySelectorAll('.controles button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  }
  document.querySelectorAll('.controles button').forEach((b) => (b.onclick = () => mostrar(b.dataset.v)));
  mostrar('novo');
</script>
</body>
</html>
